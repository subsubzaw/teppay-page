name: Auto Verify Store Requests

on:
  schedule:
    # 毎日午前3時（JST）/ 18:00 UTC に自動巡回検証
    - cron: '0 18 * * *'
  workflow_dispatch:
    # GitHub上の「Run workflow」ボタンからいつでも即時実行可能

permissions:
  contents: write

jobs:
  verify-and-ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run store request verification and ingestion
        id: verify
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: |
          python3 scripts/verify_and_ingest_requests.py

      - name: Commit and push if stores were added
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No new stores ingested."
          else
            git commit -m "[Bot] Auto-ingest verified store addition requests"
            git push origin main
          fi
